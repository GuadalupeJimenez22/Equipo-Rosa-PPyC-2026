- config:

    random_seed: null  

   
    width: 800  
    height: 800  
    cell_size: 16  
    grid_is_infinite: True  
    screen_caption: "Conway's Game of Life  [pattern {pat}]  ({paused})"
    
    living_cell_color: [255, 255, 0]
    dead_cell_color: [128, 128, 128]
    grid_line_color: [0, 0, 0]

    gen_min_pct_living_cells: 5  
    gen_max_pct_living_cells: 20  
    
    reproduction: 3
    underpopulation: 2
    overpopulation: 3
    sleep: 0.15  
    fps: 40 